<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEOW WORLD — Welcome Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#6B4A32; --ink-soft:#8A6A50; --accent:#E8935F; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:linear-gradient(160deg,#FDF4E4 0%,#F6E7CC 55%,#EFDDBE 100%);
    font-family:'Mitr','Sarabun',system-ui,sans-serif;
  }

  /* ===== Stage 16:9 — ทุกอย่างสเกลตาม stage ด้วยหน่วย cqw ===== */
  .stage{
    position:relative; overflow:hidden;
    width:min(100vw, calc(100vh * 16 / 9));
    aspect-ratio:16/9;
    container-type:size;
    border-radius:18px;
    background:#BFE3EF;
    box-shadow:0 24px 70px rgba(122,82,44,.2), 0 4px 16px rgba(122,82,44,.1);
  }
  .scene{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* ===== Brand ฝั่งซ้าย (ไม่มีปุ่ม ไม่มีการ์ด) ===== */
  .brand{ position:absolute; left:6.2%; top:12.5%; max-width:36%; z-index:3; }
  .brand .paw{ width:4.6vw; width:4.6cqw; margin-bottom:.4cqw;
    filter:drop-shadow(0 2px 4px rgba(160,110,60,.25)); }
  .brand h1{
    margin:.08em 0 .12em;
    font-family:'Baloo 2','Mitr',system-ui,sans-serif; font-weight:800;
    font-size:6.8vw; font-size:6.8cqw; line-height:.98; letter-spacing:.015em;
    color:var(--ink); text-shadow:0 2px 10px rgba(255,252,240,.65);
  }
  .brand p{
    margin:0; font-weight:500;
    font-size:2.55vw; font-size:2.55cqw; line-height:1.45;
    color:var(--ink-soft); text-shadow:0 1px 8px rgba(255,252,240,.7);
  }

  /* ===== Glass Navigation ด้านล่าง ===== */
  .glassnav{
    position:absolute; left:50%; bottom:3.4%; transform:translateX(-50%); z-index:4;
    display:flex; gap:.5cqw; padding:.8cqw 1cqw;
    background:rgba(255,250,240,.24);
    -webkit-backdrop-filter:blur(12px) saturate(1.15);
    backdrop-filter:blur(12px) saturate(1.15);
    border:1px solid rgba(255,255,255,.5);
    border-radius:999px;
    box-shadow:0 10px 28px rgba(110,78,42,.14), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .navbtn{
    display:flex; align-items:center; gap:.8cqw;
    padding:.65cqw 1.7cqw; border:0; border-radius:999px;
    background:transparent; cursor:pointer;
    font-family:'Mitr',system-ui,sans-serif; font-weight:500;
    font-size:1.95vw; font-size:1.95cqw; color:#5F4A37;
    transition:background .25s ease, transform .2s ease;
  }
  .navbtn:hover{ background:rgba(255,255,255,.38); }
  .navbtn:active{ transform:scale(.95); }
  .navbtn .ic{ width:2.5vw; width:2.5cqw; height:2.5vw; height:2.5cqw; color:var(--accent); flex:none; }

  /* ===== แคปชันตอนแตะบ้าน ===== */
  .house-caption{
    position:absolute; left:67.5%; top:40%; z-index:4; pointer-events:none;
    display:flex; align-items:center; gap:.6cqw;
    padding:.75cqw 1.7cqw; border-radius:999px;
    background:rgba(255,251,242,.93); border:1px solid rgba(255,255,255,.85);
    box-shadow:0 8px 22px rgba(120,80,45,.16);
    font-size:1.9vw; font-size:1.9cqw; font-weight:600; color:var(--ink);
    opacity:0; transform:translate(-50%,12px) scale(.6);
  }
  .house-caption .hicon{ width:1.9cqw; height:1.9cqw; color:#F077A8; }
  .house-caption.show{ animation:captionPop 2.5s ease forwards; }
  @keyframes captionPop{
    0%{opacity:0; transform:translate(-50%,14px) scale(.6);}
    12%{opacity:1; transform:translate(-50%,0) scale(1);}
    80%{opacity:1; transform:translate(-50%,-4px);}
    100%{opacity:0; transform:translate(-50%,-18px);}
  }

  .vignette{ position:absolute; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(120% 90% at 62% 30%, transparent 55%, rgba(219,164,98,.16) 100%); }

  /* ================= Scene animations (subtle & slow) ================= */
  .sun-rays{ transform-box:fill-box; transform-origin:center; animation:spinRay 140s linear infinite; }
  @keyframes spinRay{ to{ transform:rotate(360deg);} }
  .sun-halo{ transform-box:fill-box; transform-origin:center; animation:haloPulse 9s ease-in-out infinite; }
  @keyframes haloPulse{ 0%,100%{opacity:.75; transform:scale(1);} 50%{opacity:1; transform:scale(1.05);} }

  .cloud-a{ animation:drift 54s ease-in-out infinite alternate; }
  .cloud-b{ animation:driftB 66s ease-in-out infinite alternate; }
  @keyframes drift{ to{ transform:translateX(72px);} }
  @keyframes driftB{ to{ transform:translateX(-95px);} }

  .flock-a{ animation:flyAcross 46s linear infinite; }
  .flock-b{ animation:flyAcross 60s linear infinite; animation-delay:-22s; }
  @keyframes flyAcross{ from{ transform:translateX(-280px);} to{ transform:translateX(1920px);} }

  .smoke{ transform-box:fill-box; transform-origin:center; opacity:0; animation:puff 4.8s ease-out infinite; }
  .smoke.s2{ animation-delay:1.6s; } .smoke.s3{ animation-delay:3.2s; }
  @keyframes puff{ 0%{opacity:0; transform:translate(0,0) scale(.5);} 18%{opacity:.55;}
    100%{opacity:0; transform:translate(30px,-78px) scale(1.6);} }

  .sway{ transform-box:fill-box; transform-origin:50% 100%; animation:sway 4.8s ease-in-out infinite alternate; }
  .sway.d1{ animation-delay:-1.3s; } .sway.d2{ animation-delay:-2.6s; }
  .sway.d3{ animation-delay:-3.7s; animation-duration:5.6s; }
  @keyframes sway{ from{transform:rotate(-2.4deg);} to{transform:rotate(2.6deg);} }

  .sway-soft{ transform-box:fill-box; transform-origin:50% 100%; animation:swaySoft 6.4s ease-in-out infinite alternate; }
  .sway-soft.d2{ animation-delay:-2.2s; }
  @keyframes swaySoft{ from{transform:rotate(-1.1deg);} to{transform:rotate(1.2deg);} }

  .curtain{ transform-box:fill-box; transform-origin:50% 0%; animation:curtainSway 5.6s ease-in-out infinite alternate; }
  .curtain.d1{ animation-delay:-1.8s; } .curtain.d2{ animation-delay:-3.4s; }
  @keyframes curtainSway{ from{transform:rotate(-2.6deg);} to{transform:rotate(2.6deg);} }

  .window-glow{ animation:flicker 6.5s ease-in-out infinite; }
  .wg-r{ animation-delay:-2.7s; }
  @keyframes flicker{ 0%,100%{opacity:.4;} 45%{opacity:.6;} 70%{opacity:.47;} }

  .house-glow{ transform-box:fill-box; transform-origin:center; animation:glowPulse 6s ease-in-out infinite; }
  @keyframes glowPulse{ 0%,100%{opacity:.5; transform:scale(1);} 50%{opacity:.8; transform:scale(1.05);} }

  .sparkle{ transform-box:fill-box; transform-origin:center; animation:twinkle 3.8s ease-in-out infinite; }
  .sp2{animation-delay:-.8s;} .sp3{animation-delay:-1.6s;} .sp4{animation-delay:-2.3s;}
  .sp5{animation-delay:-3s;} .sp6{animation-delay:-1.2s; animation-duration:4.4s;}
  @keyframes twinkle{ 0%,100%{opacity:.25; transform:scale(.55) rotate(0deg);} 50%{opacity:1; transform:scale(1.05) rotate(20deg);} }

  .cat-tail{ transform-box:fill-box; transform-origin:0% 87%; animation:tailSw 4.4s ease-in-out infinite; }
  @keyframes tailSw{ 0%,100%{transform:rotate(-7deg);} 50%{transform:rotate(10deg);} }
  .cat-eye{ transform-box:fill-box; transform-origin:center; animation:blink 5.6s ease-in-out infinite; }
  @keyframes blink{ 0%,89%,100%{transform:scaleY(1);} 92%,95%{transform:scaleY(.08);} }

  .child-arm{ transform-box:fill-box; transform-origin:0% 85%; animation:waveArm 3.2s ease-in-out infinite; }
  @keyframes waveArm{ 0%,100%{transform:rotate(-7deg);} 50%{transform:rotate(11deg);} }

  .fg{ transform-box:fill-box; transform-origin:50% 100%; animation:fgSway 7.8s ease-in-out infinite alternate; }
  .fg.d2{ animation-delay:-3.2s; }
  .fg-flower{ transform-box:fill-box; transform-origin:50% 100%; animation:fgSway 6.8s ease-in-out infinite alternate; animation-delay:-2s; }
  @keyframes fgSway{ from{transform:rotate(-1.3deg);} to{transform:rotate(1.4deg);} }

  /* ===== Interactive House — ไม่มีกรอบปุ่ม ไม่มี UI ทับ ===== */
  #houseHotspot{ cursor:pointer; outline:none; }
  #houseHotspot .house-core{ transition:filter .5s ease; }
  #houseHotspot:hover .house-core{ filter:brightness(1.06) saturate(1.05); }
  #houseHotspot:focus-visible .house-glow{ animation:none; opacity:.95; }
  #houseHotspot.claimed .house-core{ transform-box:fill-box; transform-origin:50% 100%;
    animation:houseBounce 1s cubic-bezier(.34,1.56,.64,1); }
  @keyframes houseBounce{ 0%{transform:scale(1);} 35%{transform:scale(1.045);} 65%{transform:scale(.99);} 100%{transform:scale(1);} }
  #houseHotspot.claimed .window-glow{ animation:flare 1.6s ease-out; }
  @keyframes flare{ 0%{opacity:.45;} 25%{opacity:1;} 100%{opacity:.5;} }
  .heart{ opacity:0; transform-box:fill-box; transform-origin:center; }
  #houseHotspot.claimed .heart{ animation:heartFloat 1.8s ease-out forwards; }
  #houseHotspot.claimed .heart.h2{ animation-delay:.18s; }
  #houseHotspot.claimed .heart.h3{ animation-delay:.36s; }
  @keyframes heartFloat{ 0%{opacity:0; transform:translateY(8px) scale(.3);} 18%{opacity:1;}
    100%{opacity:0; transform:translateY(-100px) scale(1.15);} }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<main class="stage" aria-label="MEOW WORLD หน้าจอต้อนรับ">
<svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img"

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9E2F0"/><stop offset=".55" stop-color="#FBEAD2"/><stop offset="1" stop-color="#FFE9C2"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ACD9A0"/><stop offset="1" stop-color="#8BC586"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF8EA"/><stop offset="1" stop-color="#F3E1C4"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEDB3"/><stop offset="1" stop-color="#FFCF7E"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="houseGlowGrad">
      <stop offset="0" stop-color="#FFF3C6" stop-opacity=".85"/><stop offset=".6" stop-color="#FFE9A8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunTint" gradientUnits="userSpaceOnUse" cx="1245" cy="185" r="820">
      <stop offset="0" stop-color="#FFD68C" stop-opacity=".3"/><stop offset="1" stop-color="#FFD68C" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.4"/></filter>

    <path id="sparkShape" d="M0 -8 L1.9 -1.9 L8 0 L1.9 1.9 L0 8 L-1.9 1.9 L-8 0 L-1.9 -1.9 Z"/>
    <path id="heartShape" d="M0 3 C 0 .8 -2 -1.2 -4.4 -1.2 C -7.4 -1.2 -8.8 1.4 -8.8 3.8 C -8.8 7.6 -4.2 10.6 0 14 C 4.2 10.6 8.8 7.6 8.8 3.8 C 8.8 1.4 7.4 -1.2 4.4 -1.2 C 2 -1.2 0 .8 0 3 Z"/>
    <g id="tuft" fill="none" stroke-linecap="round">
      <path d="M0 0 C -3 -8 -8 -12 -12 -16" stroke-width="3"/>
      <path d="M0 0 C -.5 -9 -.5 -15 0 -20" stroke-width="3"/>
      <path d="M0 0 C 3 -8 8 -11 12 -15" stroke-width="3"/>
    </g>
    <g id="flowerP">
      <path d="M0 0 C -.5 -5 -.5 -9 0 -13" fill="none" stroke="#79BB7F" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="0" cy="-24.2" r="3.9" fill="#F6A8C8"/><circle cx="-4.95" cy="-19.6" r="3.9" fill="#F6A8C8"/>
      <circle cx="4.95" cy="-19.6" r="3.9" fill="#F6A8C8"/><circle cx="-3.06" cy="-13.9" r="3.9" fill="#F6A8C8"/>
      <circle cx="3.06" cy="-13.9" r="3.9" fill="#F6A8C8"/><circle cx="0" cy="-19" r="2.9" fill="#FFD97D"/>
    </g>
    <g id="flowerY">
      <path d="M0 0 C -.5 -5 -.5 -9 0 -13" fill="none" stroke="#79BB7F" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="0" cy="-24.2" r="3.9" fill="#FFD97D"/><circle cx="-4.95" cy="-19.6" r="3.9" fill="#FFD97D"/>
      <circle cx="4.95" cy="-19.6" r="3.9" fill="#FFD97D"/><circle cx="-3.06" cy="-13.9" r="3.9" fill="#FFD97D"/>
      <circle cx="3.06" cy="-13.9" r="3.9" fill="#FFD97D"/><circle cx="0" cy="-19" r="2.9" fill="#E8935F"/>
    </g>
    <g id="flowerW">
      <path d="M0 0 C -.5 -5 -.5 -9 0 -13" fill="none" stroke="#79BB7F" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="0" cy="-24.2" r="3.9" fill="#FFF7F0"/><circle cx="-4.95" cy="-19.6" r="3.9" fill="#FFF7F0"/>
      <circle cx="4.95" cy="-19.6" r="3.9" fill="#FFF7F0"/><circle cx="-3.06" cy="-13.9" r="3.9" fill="#FFF7F0"/>

    </g>
  </defs>

  <!-- BACKGROUND: ท้องฟ้า + พระอาทิตย์ + นก + เนินไกล -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  <g transform="translate(1245,185)">
    <circle class="sun-halo" r="150" fill="url(#sunGlow)"/>
    <g class="sun-rays" stroke="#FFD98A" stroke-width="10" stroke-linecap="round" opacity=".7">
      <line x1="0" y1="-76" x2="0" y2="-112"/><line x1="0" y1="-76" x2="0" y2="-104" transform="rotate(30)"/>
      <line x1="0" y1="-76" x2="0" y2="-112" transform="rotate(60)"/><line x1="0" y1="-76" x2="0" y2="-104" transform="rotate(90)"/>
      <line x1="0" y1="-76" x2="0" y2="-112" transform="rotate(120)"/><line x1="0" y1="-76" x2="0" y2="-104" transform="rotate(150)"/>
      <line x1="0" y1="-76" x2="0" y2="-112" transform="rotate(180)"/><line x1="0" y1="-76" x2="0" y2="-104" transform="rotate(210)"/>
      <line x1="0" y1="-76" x2="0" y2="-112" transform="rotate(240)"/><line x1="0" y1="-76" x2="0" y2="-104" transform="rotate(270)"/>
      <line x1="0" y1="-76" x2="0" y2="-112" transform="rotate(300)"/><line x1="0" y1="-76" x2="0" y2="-104" transform="rotate(330)"/>
    </g>
    <circle r="56" fill="#FFDE9A"/><circle r="42" fill="#FFEBB7"/>
  </g>
  <g transform="translate(330,150)" opacity=".92"><g class="cloud cloud-a" fill="#FFFFFF">
    <ellipse rx="54" ry="24"/><ellipse cx="-40" cy="8" rx="34" ry="17"/><ellipse cx="42" cy="8" rx="36" ry="18"/><ellipse cx="6" cy="-15" rx="30" ry="16"/>

  <g transform="translate(705,108)" opacity=".85"><g class="cloud cloud-b" fill="#FFFFFF">

  <g transform="translate(1480,92)" opacity=".9"><g class="cloud cloud-a" fill="#FFFFFF">
    <ellipse rx="44" ry="19"/><ellipse cx="-33" cy="7" rx="27" ry="14"/><ellipse cx="35" cy="7" rx="28" ry="14"/><ellipse cx="5" cy="-12" rx="24" ry="13"/>
  </g></g>
  <g transform="translate(0,190)"><g class="flock flock-a" fill="none" stroke="#6E5C4B" stroke-linecap="round">
    <path d="M0 0 C 6 -9 14 -9 20 0 C 26 -9 34 -9 40 0" stroke-width="4.5"/>
    <path d="M96 -26 C 102 -33.5 109 -33.5 114 -26 C 119 -33.5 126 -33.5 132 -26" stroke-width="4"/>
    <path d="M168 16 C 173 10 179 10 183 16 C 187 10 193 10 197 16" stroke-width="3.6"/>
  </g></g>
  <g transform="translate(0,118)"><g class="flock flock-b" fill="none" stroke="#6E5C4B" stroke-linecap="round" opacity=".7">
    <path d="M0 0 C 5 -7 11 -7 16 0 C 21 -7 27 -7 32 0" stroke-width="4"/>
    <path d="M70 -18 C 74 -24 79 -24 83 -18 C 87 -24 92 -24 96 -18" stroke-width="3.4"/>
  </g></g>
  <path d="M0 642 C 180 560 380 586 560 616 C 760 648 900 540 1120 566 C 1300 586 1440 622 1600 600 L1600 900 L0 900 Z" fill="#CBE4C1"/>
  <g>
    <g transform="translate(430,592)"><rect x="-2.5" y="-12" width="5" height="13" rx="2" fill="#B08D6E"/><circle cy="-19" r="15" fill="#A9CFA0"/></g>
    <g transform="translate(505,600)"><rect x="-2" y="-10" width="4" height="11" rx="2" fill="#B08D6E"/><circle cy="-16" r="11" fill="#A9CFA0"/></g>
    <g transform="translate(1330,588)"><rect x="-2.5" y="-12" width="5" height="13" rx="2" fill="#B08D6E"/><circle cy="-19" r="14" fill="#A9CFA0"/></g>
    <g transform="translate(1398,596)"><rect x="-2" y="-10" width="4" height="11" rx="2" fill="#B08D6E"/><circle cy="-16" r="10" fill="#A9CFA0"/></g>
  </g>
  <path d="M0 672 C 180 618 400 634 620 656 C 860 680 1020 596 1240 622 C 1400 640 1520 655 1600 646 L1600 900 L0 900 Z" fill="#B3D8A8"/>

  <!-- MIDGROUND: ทุ่งหญ้า + ทางเดิน -->
  <path d="M0 662 C 300 640 600 670 900 654 C 1150 642 1380 664 1600 652 L1600 900 L0 900 Z" fill="url(#groundGrad)"/>
  <path d="M1070 694 C 1024 764 968 834 928 900 L1170 900 C 1120 824 1094 758 1110 694 Z" fill="#EDDBAE" opacity=".95"/>

  <!-- ต้นไม้ใหญ่ (ซ้ายของบ้าน) + ต้นเล็ก (ขวา) -->
  <g>
    <ellipse cx="855" cy="694" rx="72" ry="10" fill="#7EA874" opacity=".4"/>
    <path d="M846 694 C 849 662 846 638 839 616 L 871 616 C 864 638 861 662 864 694 Z" fill="#A9744F"/>
    <g class="canopy sway-soft">
      <circle cx="810" cy="588" r="41" fill="#67A86B"/><circle cx="900" cy="590" r="43" fill="#67A86B"/>
      <circle cx="855" cy="566" r="46" fill="#6FB072"/><circle cx="827" cy="545" r="31" fill="#78B979"/>
      <circle cx="883" cy="547" r="33" fill="#78B979"/><circle cx="855" cy="527" r="36" fill="#7FC17F"/>
    </g>
  </g>
  <g>
    <ellipse cx="1408" cy="696" rx="54" ry="9" fill="#7EA874" opacity=".4"/>
    <path d="M1401 696 C 1404 670 1401 652 1395 636 L 1421 636 C 1415 652 1412 670 1415 696 Z" fill="#A9744F"/>
    <g class="canopy sway-soft d2">
      <circle cx="1376" cy="606" r="31" fill="#6CAC70"/><circle cx="1440" cy="608" r="33" fill="#6CAC70"/>
      <circle cx="1408" cy="588" r="38" fill="#74B477"/><circle cx="1408" cy="562" r="27" fill="#7FC17F"/>

  </g>
  <g transform="translate(300,690)">
    <ellipse cy="4" rx="46" ry="7" fill="#7EA874" opacity=".35"/>
    <circle cx="-24" cy="6" r="19" fill="#77B477"/><circle cx="24" cy="6" r="21" fill="#77B477"/><circle cy="-4" r="26" fill="#7FBB7B"/>
    <circle cx="-14" cy="-14" r="3" fill="#FFD97D"/><circle cx="10" cy="-20" r="3" fill="#F6A8C8"/><circle cx="22" cy="-8" r="3" fill="#FFF7F0"/>
  </g>

  <!-- ★ INTERACTIVE HOUSE — hotspot ที่สำคัญที่สุด (ไม่มีกรอบ/ปุ่ม/ข้อความ) -->
  <g id="houseHotspot" role="button" tabindex="0" aria-label="แตะบ้านเพื่อเข้าสู่โลกของคุณ">
    <ellipse class="house-glow" cx="1090" cy="588" rx="235" ry="185" fill="url(#houseGlowGrad)"/>
    <g class="house-core">
      <ellipse cx="1090" cy="698" rx="168" ry="15" fill="#7EA874" opacity=".45"/>

<script>
  const hot = document.getElementById('houseHotspot');
  const cap = document.getElementById('houseCaption');
  let timer;
  function claim(){
    hot.classList.remove('claimed');
    void hot.getBoundingClientRect();          // restart animation
    hot.classList.add('claimed');
    cap.classList.remove('show');
    void cap.offsetWidth;
    cap.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => {
      hot.classList.remove('claimed');
      cap.classList.remove('show');
    }, 2500);
    // จุดเชื่อมต่อจริง: ในแอปให้ navigate เข้าสู่ onboarding / โลกของผู้ใช้ตรงนี้
  }
  hot.addEventListener('click', claim);
  hot.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); claim(); }
  });
</script>
